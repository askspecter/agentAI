<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Log in · olea</title>
<link rel="icon" href="/favicon.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="modulepreload" href="/login-bundle.js?v=4"/>
<link rel="preconnect" href="https://auth.privy.io" crossorigin/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"/>
<link rel="stylesheet" href="/styles.css"/>
<style>
.wrap-login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.wrap-login:before{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(700px 520px at 50% 8%,rgba(164,181,110,.14),transparent 60%)}
.card-login{width:100%;max-width:400px;background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid var(--line);border-radius:20px;padding:34px 30px;text-align:center;
  box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
.card-login .mk{width:56px;height:56px;margin:0 auto 18px;border-radius:15px;display:grid;place-items:center;
  background:var(--olive-soft);border:1px solid rgba(164,181,110,.25)}
.card-login .mk img{width:30px}
.card-login h1{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.card-login p.sub{color:var(--muted);font-size:14.5px;margin-top:8px;line-height:1.5}
.card-login .btn{width:100%;margin-top:22px}
.card-login .status{color:var(--faint);font-size:13px;margin-top:14px;min-height:18px}
.card-login .guest{display:inline-block;margin-top:16px;color:var(--muted);font-size:13.5px}
.card-login .guest:hover{color:var(--olive)}
.card-login .fine{color:var(--faint);font-size:11.5px;margin-top:22px;line-height:1.5}
.card-login .fine a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--olive);border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:8px;animation:spin .7s linear infinite}
</style>
</head><body>
<div class="wrap-login">
  <div id="root" class="card-login">
    <div class="mk"><img src="/olea-mark.png" alt="olea"/></div>
    <h1>Log in to olea</h1>
    <p class="sub">Continue with email or your wallet.</p>
    <button id="continueBtn" class="btn btn-primary">Continue</button>
    <div class="status" id="lstatus"></div>
    <a class="guest" href="/app">Continue as guest →</a>
    <div class="fine">By continuing you agree to our <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</div>
  </div>
</div>

<script>
// Instant card. The heavy Privy bundle is only loaded on intent (tap), or
// automatically for returning users and the logout flow. Keeps the page fast
// on mobile instead of executing a large bundle on every visit.
(function () {
  var btn = document.getElementById("continueBtn");
  var status = document.getElementById("lstatus");
  var loading = false;
  function load(attempt) {
    return import("/login-bundle.js?v=4").catch(function (e) {
      if (attempt < 3) {
        return new Promise(function (r) { setTimeout(r, 700 * attempt); }).then(function () { return load(attempt + 1); });
      }
      throw e;
    });
  }
  function start() {
    if (loading) return;
    loading = true;
    btn.disabled = true;
    btn.textContent = "Opening…";
    status.innerHTML = '<span class="spinner"></span>Opening secure login…';
    load(1).catch(function (e) {
      loading = false;
      btn.disabled = false;
      btn.textContent = "Try again";
      status.textContent = "Could not load. Check your connection, or continue as guest.";
      console.error("login bundle failed:", e);
    });
  }
  btn.addEventListener("click", start);

  var params = new URLSearchParams(window.location.search);
  var returning = false;
  try { returning = localStorage.getItem("olea_authed") === "1"; } catch (e) {}
  if (params.has("logout") || returning) start();
})();
</script>
</body></html>
